<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB01A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>

    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FFB01A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#iconGradient)" filter="url(#iconShadow)"/>

  <!-- Inner white circle -->
  <circle cx="256" cy="256" r="200" fill="#FAF6E9"/>

  <!-- Book icon -->
  <g transform="translate(156, 156)">
    <!-- Book spine -->
    <rect x="0" y="0" width="200" height="200" rx="20" fill="#FFB01A"/>

    <!-- Book pages -->
    <rect x="20" y="20" width="160" height="160" rx="10" fill="#FAF6E9"/>

    <!-- Book lines -->
    <line x1="40" y1="60" x2="160" y2="60" stroke="#FFB01A" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="100" x2="160" y2="100" stroke="#FFB01A" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="140" x2="160" y2="140" stroke="#FFB01A" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="180" x2="140" y2="180" stroke="#FFB01A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Sparkle accent -->
  <g transform="translate(180, 180)">
    <path d="M0 0 L4 8 L0 12 L-4 8 Z" fill="#FFD700" opacity="0.8"/>
  </g>
</svg>











